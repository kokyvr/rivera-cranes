<section class="cotizacion section" id="cotizacion">
  <div class="container">
    <div class="quote-wrapper">
      <div class="quote-info">
        <span class="section-subtitle">COTIZACIÓN</span>
        <h2>Solicita una cotización</h2>
        <p>
          Completa el formulario y nuestro equipo se pondrá en contacto contigo
          para brindarte una propuesta de acuerdo con tu requerimiento.
        </p>
        <div class="quote-items" id="quote-items"></div>
      </div>
      <div class="quote-form">
        <form id="quote-form">
          <div class="form-grid">
            <input type="text" placeholder="Nombre completo" />
            <input type="text" placeholder="Empresa" />
            <input type="tel" placeholder="WhatsApp" />
            <input type="email" placeholder="Correo electrónico" />
          </div>
          <select id="servicio">
            <option value="">Seleccione un servicio</option>
            <option value="telescopica">Grúas Telescópicas</option>
            <option value="articulada">Grúas Articuladas</option>
            <option value="transporte">Servicio de Transporte</option>
            <option value="trailer">Alquiler de Tráiler</option>
            <option value="cama">Alquiler de Cama Baja</option>
          </select>
          <div id="extra-fields"></div>
          <div class="form-grid">
            <input type="text" placeholder="Lugar del servicio" />
            <input type="date" />
          </div>
          <textarea placeholder="Información adicional"></textarea>
          <button type="submit" class="btn-primary">Enviar Solicitud</button>
        </form>
      </div>
    </div>
  </div>
</section>
